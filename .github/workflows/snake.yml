name: Generate Snake Contribution

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for proper git history

      - name: Create dist directory
        run: mkdir -p dist  # Ensure directory exists

      - name: Generate snake visualization
        uses: platane/snk@v2
        with:
          github_user_name: Safae26  # Your GitHub username
          outputs: |
            gif: dist/snake.gif
            svg: dist/snake.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git add dist/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update snake game [skip ci]"
          git push
