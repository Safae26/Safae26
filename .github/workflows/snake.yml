name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Use latest checkout action
      - uses: actions/checkout@v4

      # Use newer version of snk that doesn't use set-output
      - uses: Platane/snk@v2
        id: snake-gif
        with:
          github_user_name: Safae26
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      - run: git status

      # Use modern push action alternative
      - name: Push changes
        uses: actions-js/push@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      # Use latest GitHub Pages action
      - uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          destination_dir: ./output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
