name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Updated snk action with correct inputs
      - uses: Platane/snk@v2
        id: snake-gif
        with:
          github_user_name: Safae26
          outputs: |
            gif:dist/github-contribution-grid-snake.gif
            svg:dist/github-contribution-grid-snake.svg

      - run: git status

      - name: Push changes
        uses: actions-js/push@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      - uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./dist
          destination_dir: ./output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
